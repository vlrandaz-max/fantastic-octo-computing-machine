<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>L&amp;R Homes, Inc.</title>
    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves static files only, so a direct hit on a client
      // route (e.g. /fantastic-octo-computing-machine/classic) 404s here.
      // Stash the real path in the query string and redirect to the app's
      // index — main.tsx restores it via history.replaceState before the
      // app mounts, so App.tsx's route matching sees the right path.
      var pathSegmentsToKeep = 1; // just the repo name segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
